[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "A conservative, supervised DJI Tello command test harness"
requires-python = ">=3.11"
dependencies = [
    "djitellopy==2.5.0",
    "av==14.2.0",
    "psutil>=5.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]
llm = ["openai>=1,<2"]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live_llm: opt-in live LLM acceptance gate; requires SENTINEL_RUN_LIVE_LLM_ACCEPTANCE=1 and real provider config",
]

[tool.setuptools.packages.find]
where = ["src"]
