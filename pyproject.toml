[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "A conservative, supervised DJI Tello command test harness"
requires-python = ">=3.11"
dependencies = [
    "djitellopy==2.5.0",
    "av==14.2.0",
    "psutil>=5.9",
    "opencv-contrib-python>=5.0.0.93",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]
