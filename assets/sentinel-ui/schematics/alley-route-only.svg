<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="group" aria-label="Route-only middle zones" data-mode="ROUTE_ONLY_2_ZONE"><style>.survey-zone polygon {fill:#1B2733;stroke:#8296A8;stroke-width:.65;vector-effect:non-scaling-stroke}
.survey-zone[data-status="SURVEYING"] polygon {fill:#213F43;stroke:#47D7C8}
.survey-zone[data-status="SURVEYED"] polygon {fill:#254C45;stroke:#47D7C8}
.survey-zone[data-status="HAZARD_PENDING"] polygon {fill:#473B25;stroke:#F2BA55}
.survey-zone[data-status="BLOCKED"] polygon {fill:#492E35;stroke:#F06565}
.survey-zone.is-selected polygon {stroke:#F3F6F8;stroke-width:2.5}
.survey-zone:focus {outline:none}
.survey-zone:focus-visible polygon {stroke:#47D7C8;stroke-width:3;stroke-dasharray:5 2}
.zone-name {fill:#F3F6F8;font:4.3px system-ui,sans-serif;pointer-events:none}
.zone-status {fill:#A9BAC8;font:3px system-ui,sans-serif;pointer-events:none}</style><text x="50" y="5" text-anchor="middle" fill="#A9BAC8" font-family="system-ui,sans-serif" font-size="2.7">Route-only middle zones</text><g id="LEFT_ALLEY_MIDDLE" class="survey-zone" data-label="Left Middle" data-status="UNSURVEYED" role="button" tabindex="0" aria-pressed="false" aria-label="Left Middle: Not surveyed"><title>LEFT_ALLEY_MIDDLE</title><polygon points="34,68 56,68 56,94 34,94 34,68"/><text class="zone-name" x="45" y="76" text-anchor="middle"><tspan x="45">Left</tspan><tspan x="45" dy="5">Middle</tspan></text><text class="zone-status" x="45" y="88" text-anchor="middle">Not surveyed</text></g><g id="RIGHT_ALLEY_MIDDLE" class="survey-zone" data-label="Right Middle" data-status="UNSURVEYED" role="button" tabindex="0" aria-pressed="false" aria-label="Right Middle: Not surveyed"><title>RIGHT_ALLEY_MIDDLE</title><polygon points="34,12 56,12 56,38 34,38 34,12"/><text class="zone-name" x="45" y="20" text-anchor="middle"><tspan x="45">Right</tspan><tspan x="45" dy="5">Middle</tspan></text><text class="zone-status" x="45" y="32" text-anchor="middle">Not surveyed</text></g><text x="50" y="52" text-anchor="middle" fill="#A9BAC8" font-family="system-ui,sans-serif" font-size="2.6">route-only, not visually verified</text></svg>
