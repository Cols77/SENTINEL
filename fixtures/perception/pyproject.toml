[project]
name = "sentinel-perception"
version = "0.1.0"
description = "Yaw-scan perception for the SENTINEL demonstrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av==14.2.0",
    "accelerate>=1.15.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.17.0",
]

[project.scripts]
sentinel-perception = "sentinel_perception.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
